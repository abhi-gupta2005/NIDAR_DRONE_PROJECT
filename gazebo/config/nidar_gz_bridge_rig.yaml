# ros_gz_bridge config: NIDAR sensors + the rig's motion interface (no PX4).
#   ros2 run ros_gz_bridge parameter_bridge --ros-args -p config_file:=<this file>
- ros_topic_name: "/nidar/scan"
  gz_topic_name: "/nidar/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
- ros_topic_name: "/nidar/camera/image"
  gz_topic_name: "/nidar/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/nidar/rig/cmd_vel"
  gz_topic_name: "/model/nidar_rig/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/nidar/rig/odom"
  gz_topic_name: "/model/nidar_rig/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
