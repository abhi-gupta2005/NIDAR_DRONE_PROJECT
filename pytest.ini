[pytest]
testpaths = tests
addopts = -ra --strict-markers -p no:cacheprovider
markers =
    slow: takes more than a few seconds
    network: opens loopback sockets
    hardware: needs a physical sensor or camera (skipped by default)
    finding: documents a known defect (xfail until fixed)
filterwarnings =
    ignore::DeprecationWarning
